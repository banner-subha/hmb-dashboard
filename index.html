<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>HMB Ispat — Sales Intelligence Platform</title>
    <script>
      // Set the theme before React mounts to avoid a flash of the wrong theme.
      // Default is dark when no preference is saved.
      (function () {
        try {
          var t = localStorage.getItem('hmb-dashboard-theme');
          if (t !== 'light') t = 'dark';
        } catch (t) { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
