[build]
  command = "npm run build"
  publish = "dist"

# Cache geo boundary files aggressively (immutable — content-addressed by filename)
[[headers]]
  for = "/geo/*.geojson"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/geo/*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

